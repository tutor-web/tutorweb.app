# Expected *repository* secrets:
#   DEBUG_KEYSTORE_BASE64 — base64-encoded shared debug keystore, alias
#     androiddebugkey, store and key password "android".
#       keytool -genkeypair -v -keystore debug-keystore.jks -storetype JKS \
#         -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
#         -storepass android -keypass android \
#         -dname "CN=Android Debug,O=Android,C=US"
#       base64 -w0 debug-keystore.jks
#
# Expected *environment* secrets for the signed release build:
#
#   ANDROID_KEYSTORE_BASE64 — base64-encoded signing keystore.
#     Generate the keystore first (see README.md "Building a signed
#     release bundle"), then run:
#       base64 -w0 upload-keystore.jks
#     and paste the output as the secret value.
#
#   ANDROID_KEYSTORE_PASSWORD — the store/key password set when creating
#     the keystore (the value given to `keytool -genkeypair` for
#     -storepass/-keypass, or entered interactively if prompted).
#
#   TW_DUMP_KEY — shared secret for the server's @@quizdb-tutorial-dump, i.e.
#     quizdb-dump-key in buildout.cfg.
#
# Optional *repository* variables, passed through to bin/build.sh
#
#   AD_UNIT_ID_ANDROID — the AdMob unit ads are requested from. Defaults
#     to Google's test unit, which only ever serves test ads.
#
#   BACKEND_ROOT — the backend the app talks to (NB: not Plone)
#
#   SEED_ROOT — where seed content is fetched from, defaults to tutor-web.net
#
#   SEED_TUTORIALS — space-separated portal paths to bundle as seed content,
#     e.g. "math/math099.1 math/math100.1".
#
name: Build Android app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM_VERSION: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    # Pull requests are handled by pr-build below, which needs no secrets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Needed to publish the APK as a release asset
    permissions:
      contents: write
    # Holds ANDROID_KEYSTORE_*/TW_DUMP_KEY as environment secrets
    environment: main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'

      - name: Cache Android SDK platform & build-tools
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_PLATFORM_VERSION }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: android-sdk-platform${{ env.ANDROID_PLATFORM_VERSION }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Install Android SDK platform & build-tools
        # Skipped on a cache hit — this is the step that would otherwise
        # hit Google's servers on every run.
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "platforms;android-${ANDROID_PLATFORM_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - run: npm ci

      - name: Restore shared debug keystore
        # A repository rather than environment secret, so a pull request from
        # a branch of this repo gets it too. A fork pull request gets nothing
        # - GitHub withholds secrets from those - and bin/build.sh then falls
        # back to a per-machine key: the APK still builds, it just will not
        # install over anyone else's.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
              base64 -d <<< "${DEBUG_KEYSTORE_BASE64}" > debug-keystore.jks
          else
              echo "No DEBUG_KEYSTORE_BASE64 set; debug build will use a per-machine key" >&2
          fi

      - name: Stamp the version into config.xml
        # versionCode: The number Android and Play order updates by, should increment
        # versionName: The readable half, used for tagged versions
        run: |
          case "${GITHUB_REF}" in
              refs/tags/v*) VERSION_NAME="${GITHUB_REF_NAME#v}" ;;
              *)            VERSION_NAME="main-$(git rev-parse --short HEAD)" ;;
          esac
          bin/stamp-version.sh "${VERSION_NAME}" "${GITHUB_RUN_NUMBER}"

      - name: Restore signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: base64 -d <<< "${ANDROID_KEYSTORE_BASE64}" > upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bin/build.sh
        env:
          TW_DUMP_KEY: ${{ secrets.TW_DUMP_KEY }}
          AD_UNIT_ID_ANDROID: ${{ vars.AD_UNIT_ID_ANDROID }}
          BACKEND_ROOT: ${{ vars.BACKEND_ROOT }}
          SEED_ROOT: ${{ vars.SEED_ROOT }}
          SEED_TUTORIALS: ${{ vars.SEED_TUTORIALS }}

      - name: Build signed release bundle
        # Also produces the debug APK along the way (see bin/build.sh).
        if: startsWith(github.ref, 'refs/tags/v')
        run: bin/build.sh release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TW_DUMP_KEY: ${{ secrets.TW_DUMP_KEY }}
          AD_UNIT_ID_ANDROID: ${{ vars.AD_UNIT_ID_ANDROID }}
          BACKEND_ROOT: ${{ vars.BACKEND_ROOT }}
          SEED_ROOT: ${{ vars.SEED_ROOT }}
          SEED_TUTORIALS: ${{ vars.SEED_TUTORIALS }}

      - name: Remove keystore
        if: always()
        run: rm -f upload-keystore.jks debug-keystore.jks

      - name: Publish the rolling main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk tutorweb-app-main.apk
          # Recreated rather than edited, so the main-latest tag keeps up with
          # main instead of staying pinned to whenever it was first made
          gh release delete main-latest --cleanup-tag --yes || true
          gh release create main-latest tutorweb-app-main.apk \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Latest main build" \
              --notes "Debug build of ${GITHUB_SHA}, versionCode ${GITHUB_RUN_NUMBER}. Signed with the shared debug key, so it installs over an earlier build of the same app. Replaced on every push to main."

      - name: Attach builds to the tagged release for Play store
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp platforms/android/app/build/outputs/apk/release/app-release.apk \
              "tutorweb-app-${GITHUB_REF_NAME}.apk"
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
              "tutorweb-app-${GITHUB_REF_NAME}.apk" \
              platforms/android/app/build/outputs/bundle/release/app-release.aab \
              --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: app-release
          path: |
            platforms/android/app/build/outputs/bundle/release/app-release.aab
            platforms/android/app/build/outputs/apk/release/app-release.apk

  # Plain build to catch compile-time errors
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'

      - name: Cache Android SDK platform & build-tools
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_PLATFORM_VERSION }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: android-sdk-platform${{ env.ANDROID_PLATFORM_VERSION }}-buildtools${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Install Android SDK platform & build-tools
        # Skipped on a cache hit — this is the step that would otherwise
        # hit Google's servers on every run.
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "platforms;android-${ANDROID_PLATFORM_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - run: npm ci

      - name: Restore shared debug keystore
        # A repository rather than environment secret, so a pull request from
        # a branch of this repo gets it too. A fork pull request gets nothing
        # - GitHub withholds secrets from those - and bin/build.sh then falls
        # back to a per-machine key: the APK still builds, it just will not
        # install over anyone else's.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
              base64 -d <<< "${DEBUG_KEYSTORE_BASE64}" > debug-keystore.jks
          else
              echo "No DEBUG_KEYSTORE_BASE64 set; debug build will use a per-machine key" >&2
          fi

      - name: Stamp the version into config.xml
        # Same scheme as the build job, so a PR APK installs over a main build
        # and reports which PR it came from. run_number is shared across the
        # whole workflow, so it stays ahead of whatever main last built. The
        # head sha rather than HEAD, which here is the ephemeral merge commit.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/stamp-version.sh "pr${PR_NUMBER}-${PR_HEAD_SHA:0:7}" "${GITHUB_RUN_NUMBER}"

      - name: Build debug APK
        # SEED_TUTORIALS is deliberately not passed: fetching seed content
        # needs TW_DUMP_KEY, and this job has no environment secrets, so
        # bin/build.sh would fail rather than quietly ship an unseeded app.
        run: bin/build.sh
        env:
          AD_UNIT_ID_ANDROID: ${{ vars.AD_UNIT_ID_ANDROID }}
          BACKEND_ROOT: ${{ vars.BACKEND_ROOT }}
          SEED_ROOT: ${{ vars.SEED_ROOT }}

      - name: Remove keystore
        if: always()
        run: rm -f debug-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
